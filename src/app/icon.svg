<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon do Meridiano, desenhado a partir da marca que o dono mandou.

    Duas escolhas dele que valem registrar, porque contrariam uma versão
    anterior deste arquivo:

    1. O globo é CINZA, não escuro. Deixa a linha teal e o zênite âmbar
       serem os únicos elementos com cor — que é o que dá nome ao app.
    2. A linha ULTRAPASSA a esfera, em cima e embaixo. A versão anterior a
       terminava no círculo com o argumento de que passar viraria agulha;
       a marca do dono decide, e ela passa.

    A única liberdade tomada aqui é a placa clara de fundo: a arte original
    é transparente, e um globo cinza claro sobre uma barra de abas escura
    desapareceria. A placa mantém o ícone legível nos dois temas.

    A 16px o que sobrevive é a silhueta — círculo externo, linha teal e
    ponto âmbar. Os paralelos e os meridianos internos existem para o
    tamanho grande e somem sem prejuízo no pequeno; por isso têm menos peso.
  -->
  <rect width="32" height="32" rx="7" fill="#f7f6f2"/>

  <!-- Globo em grade, cinza.
       O círculo externo é mais escuro e mais grosso que a grade interna
       de propósito: renderizado a 16px, um cinza claro uniforme sobre o
       creme perde contraste e a silhueta some. O peso extra fica só no
       contorno, que é o que sobrevive no tamanho pequeno; a grade
       continua leve e some sem prejuízo. -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#6f6f6f" stroke-width="1.9"/>
  <g fill="none" stroke="#8e8e8e" stroke-linecap="round" stroke-width="1.15">
    <path d="M6.6 12.4h18.8M6.6 19.6h18.8"/>
    <ellipse cx="16" cy="16" rx="5" ry="10"/>
  </g>

  <!-- O meridiano: a linha de referência que dá nome ao app.
       Passa da esfera nas duas pontas, como na marca. -->
  <path d="M16 2.6v26.8" stroke="#0d6b66" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Zênite: o sol no ponto alto, sobre a linha -->
  <circle cx="16" cy="7.8" r="2.5" fill="#8a6508"/>
</svg>
