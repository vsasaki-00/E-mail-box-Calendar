name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # O postinstall roda `prisma generate`, necessario antes do typecheck.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Os testes de nucleo nao tocam o banco de proposito: rodam em segundos.
      - run: pnpm test

      - run: pnpm build
