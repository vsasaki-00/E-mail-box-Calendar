# Sincronização automática das caixas, 1× por dia.
#
# Por que aqui e não no `vercel.json`: o plano Hobby da Vercel só aceita cron
# uma vez por dia — um `0 7,13,19 * * *` ali faz o deploy ser RECUSADO, não
# ignorado. O `vercel.json` segue com o disparo diário como rede de segurança:
# se este workflow for desligado, a sincronização não para de vez. Mas rede de
# segurança não é substituto: a rota da Vercel processa o que cabe em ~25 s,
# enquanto aqui o laço tem 15 minutos para esvaziar o que estiver vencido.
#
# ERA 3× POR DIA ATÉ 13/09/2026, E O MOTIVO DA MUDANÇA É DINHEIRO.
#
# A frase "roda de graça em repositório público" que estava aqui envelheceu:
# este repositório é PRIVADO, e no privado o GitHub cobra por minuto com a
# franquia de 2.000 por mês para a conta inteira. Medido em setembro: cada
# execução deste workflow custa 18 MINUTOS cobrados — de longe o job mais caro
# da casa, porque ele trabalha de verdade (o laço vai até esvaziar ou até
# estourar o próprio relógio). Três por dia são ~1.640 minutos por mês, 82% da
# franquia de TODOS os produtos, e em 12/09 a franquia acabou: o GitHub parou
# de iniciar todos os jobs da conta, inclusive os seis backups diários.
#
# Uma vez por dia custa ~547, e SÓ EM DIA ÚTIL custa ~396 — é a versão que
# ficou. O que se perde está dito sem rodeio: a caixa passa a ser lida de
# manhã, o que chegar depois espera o dia seguinte, e o que chegar na sexta à
# tarde espera até segunda de manhã. Para uma caixa de escritório isso combina
# com quem escreve para ela; para uma caixa que recebe cliente no fim de
# semana, não combina, e a correção é uma linha.
#
# A rede de segurança do `vercel.json` continua rodando TODO dia, inclusive
# sábado e domingo — ela processa bem menos (o que cabe em ~25 s contra os 15
# minutos do laço daqui), mas não deixa o fim de semana sem nenhuma passada.
#
# Se a carga de um dia não couber nos 15 minutos do laço, a sobra vai para o
# dia seguinte e pode acumular — é o sinal de que o caminho passa a ser pagar
# o Actions, assinar o Vercel Pro, ou mover este laço para uma máquina que já
# esteja ligada, como o backup da Torre de Controle faz desde 12/09.
#
# Se um dia o projeto virar Pro na Vercel, dá para mover o horário para o
# `vercel.json` e apagar este arquivo.

name: Sincronizar caixas

on:
  schedule:
    # Horário em UTC. São Paulo é UTC-3 o ano todo (não há mais horário de
    # verão no Brasil desde 2019), então isto é 07h de Brasília — a passada
    # ficou na PRIMEIRA das três que existiam, e não na do meio, para a caixa
    # do dia começar lida em vez de terminar lida.
    # `1-5` é segunda a sexta. Fim de semana fica com a rede de segurança do
    # `vercel.json`, que é diária.
    - cron: '0 10 * * 1-5'
  # Para disparar à mão pela aba Actions, sem esperar o horário.
  workflow_dispatch:

# Duas execuções ao mesmo tempo brigariam pelo mesmo cursor de cada caixa.
concurrency:
  group: sincronizar
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    # Folga sobre o limite do laço (15 min) mais a triagem. O corte de
    # verdade é o do laço, que sai limpo; este aqui é só rede de segurança
    # para um curl travado.
    timeout-minutes: 25

    steps:
      - name: Rodar o ciclo até não sobrar nada
        env:
          URL: ${{ secrets.MERIDIANO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Faltam os secrets MERIDIANO_URL e/ou CRON_SECRET." >&2
            echo "Settings → Secrets and variables → Actions → New repository secret." >&2
            exit 1
          fi

          # Cada chamada processa o que couber em ~25s e devolve quantos
          # recursos continuam vencidos. Uma caixa já em dia zera na primeira
          # volta; uma carga inicial de várias caixas não zera NUNCA dentro de
          # uma execução — são milhares de mensagens, uma página por vez.
          #
          # Por isso o laço tem relógio próprio, e não só um teto de voltas:
          # ao acabar o tempo ele sai LIMPO, dizendo quanto sobrou, e o
          # próximo horário continua de onde parou. A primeira versão deixava
          # o runner estourar o `timeout-minutes` — job vermelho, passo de
          # triagem pulado, e nada disso descrevia a realidade, que era
          # simplesmente "a carga inicial é grande". Progresso parcial é o
          # funcionamento normal aqui, não uma falha.
          LIMITE_SEGUNDOS=$((15 * 60))
          COMECOU=$(date +%s)
          MAX_VOLTAS=60

          # Uma volta que falha NÃO derruba o job. O sync é retomável por
          # desenho: cada página foi gravada com seu cursor, então a volta
          # seguinte retoma de onde parou. Desistir na primeira falha faria
          # um 504 isolado — ou um deploy acontecendo no meio — jogar fora as
          # 29 voltas restantes. O que não dá para tolerar é falha atrás de
          # falha: aí não é soluço, é a rota fora do ar.
          #
          # Sem `--retry`: o laço já é a repetição, e o retry do curl fazia
          # três chamadas de 60s antes de qualquer diagnóstico aparecer.
          MAX_FALHAS_SEGUIDAS=3
          falhas_seguidas=0

          pendentes=0

          for volta in $(seq 1 "$MAX_VOLTAS"); do
            decorrido=$(( $(date +%s) - COMECOU ))
            if [ "$decorrido" -ge "$LIMITE_SEGUNDOS" ]; then
              echo "Tempo do laço esgotado em $volta volta(s); $pendentes recurso(s) ainda vencido(s)."
              echo "O progresso está gravado — o próximo horário continua daqui."
              break
            fi

            # `automacao=0`: as voltas de carga não gastam chamada de modelo.
            # A triagem roda uma vez só, no fim.
            if ! resposta=$(curl --fail-with-body --silent --show-error \
              --max-time 90 \
              -H "x-cron-secret: $CRON_SECRET" \
              "$URL/api/cron/sync?automacao=0"); then
              falhas_seguidas=$((falhas_seguidas + 1))
              # Uma linha só: a página de erro da Vercel vem em HTML e
              # despejá-la inteira esconde o que importa.
              resumo=$(echo "$resposta" | tr -d '\r' | tr '\n' ' ' | cut -c1-300)
              echo "::warning::volta $volta falhou ($falhas_seguidas seguida(s)): $resumo"
              if [ "$falhas_seguidas" -ge "$MAX_FALHAS_SEGUIDAS" ]; then
                echo "::error::$MAX_FALHAS_SEGUIDAS falhas seguidas — parando."
                exit 1
              fi
              sleep 15
              continue
            fi
            falhas_seguidas=0

            # Só contagens saem no log — nunca assunto, remetente ou corpo.
            echo "volta $volta: $(echo "$resposta" | jq -c '.sync')"

            # A instância ainda está terminando a volta anterior: o trabalho
            # está acontecendo, só não nesta chamada. Insistir sem pausa faz
            # a mesma instância receber a próxima chamada no mesmo estado —
            # e era assim que dois ciclos empilhados esgotavam as 5 conexões
            # do pool. Esperar é o que resolve.
            if [ "$(echo "$resposta" | jq -r '.ocupado // false')" = "true" ]; then
              echo "volta $volta: instância ocupada; esperando a volta anterior terminar."
              sleep 20
              continue
            fi

            erro=$(echo "$resposta" | jq -r '.sync.erro // empty')
            if [ -n "$erro" ]; then
              echo "::error::Ciclo de sync falhou: $erro"
              exit 1
            fi

            pendentes=$(echo "$resposta" | jq -r '.sync.pendentes // 0')
            if [ "$pendentes" -eq 0 ]; then
              echo "Nada mais vencido depois de $volta volta(s)."
              break
            fi
          done

          # Sair com trabalho pendente é sucesso: o job não mente sobre o que
          # aconteceu, e o horário seguinte retoma.
          echo "::notice::Sincronização encerrada com $pendentes recurso(s) pendente(s)."


      - name: Triagem e cobranças
        env:
          URL: ${{ secrets.MERIDIANO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if ! resposta=$(curl --fail-with-body --silent --show-error \
            --max-time 90 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$URL/api/cron/sync"); then
            # A carga já aconteceu no passo anterior; a triagem sozinha não
            # vale um job vermelho.
            echo "::warning::A chamada de triagem falhou: $(echo "$resposta" | tr '\n' ' ' | cut -c1-300)"
            exit 0
          fi
          echo "$resposta" | jq -c '{sync, automacao}'

          # A automação falhar não invalida o sync que já aconteceu: vira
          # aviso, e não job vermelho.
          erro=$(echo "$resposta" | jq -r '.automacao.erro // empty')
          if [ -n "$erro" ]; then
            echo "::warning::Automação não rodou: $erro"
          fi
