# Autorizacao dos build scripts que o projeto REALMENTE precisa.
#
# Sem isto, o pnpm bloqueia o `prisma generate` e o app quebra bem depois,
# com um erro que nao aponta para a causa.
#
# As DUAS chaves existem porque o pnpm mudou de nome entre versoes, e nao
# ha uma que sirva para as duas:
#   - `allowBuilds`            -> pnpm 11 (mapa, com true/false explicito)
#   - `onlyBuiltDependencies`  -> pnpm 10 e anteriores (lista)
# O pnpm 11 chegou a reescrever este arquivo sozinho para me dizer isso.
# Verificado nas duas versoes.
#
# A lista e curta de proposito: cada entrada e um pacote autorizado a
# executar codigo na sua maquina durante a instalacao.

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
