<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Meridiano</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #f7f6f2; color: #1b2430; padding: 24px;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 380px; text-align: center; }
      h1 { font: 600 20px/1.3 ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; margin: 16px 0 8px; }
      p { color: #6a7180; margin: 0 0 20px; }
      button {
        font: inherit; padding: 9px 18px; border-radius: 3px; cursor: pointer;
        border: 1px solid #0f7d78; background: #0f7d78; color: #fffdf9;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="52" height="52" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="10" fill="none" stroke="#6f6f6f" stroke-width="1.9" />
        <g fill="none" stroke="#8e8e8e" stroke-width="1.15" stroke-linecap="round">
          <path d="M6.6 12.4h18.8M6.6 19.6h18.8" />
          <ellipse cx="16" cy="16" rx="5" ry="10" />
        </g>
        <path d="M16 2.6v26.8" stroke="#0d6b66" stroke-width="2.4" stroke-linecap="round" />
        <circle cx="16" cy="7.8" r="2.5" fill="#8a6508" />
      </svg>
      <h1>Sem conexão</h1>
      <!-- Honesto de propósito: o app NÃO guarda o conteúdo no aparelho,
           então offline não há o que mostrar. Ver docs/12-pwa.md -->
      <p>
        O Meridiano não guarda seus e-mails no aparelho — por segurança. Sem rede, não há
        o que mostrar. Assim que a conexão voltar, tudo está lá.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
